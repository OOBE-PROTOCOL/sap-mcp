name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & Typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Disable minimumReleaseAge policy (CI lockfile check)
        run: pnpm config set minimumReleaseAge 0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check architecture boundaries
        run: pnpm run check:architecture

      - name: Verify tool modules
        run: pnpm run verify:tool-modules

      - name: Verify workspace packages
        run: pnpm run verify:workspace-packages

      - name: Verify package boundaries
        run: pnpm run verify:package-boundaries

      - name: Verify tool plugin template
        run: pnpm run verify:tool-plugin-template

      - name: Verify tool execution pipeline
        run: pnpm run verify:tool-execution-pipeline

      - name: Verify skill workflows
        run: pnpm run verify:skill-workflows

      - name: Verify company readiness
        run: pnpm run verify:company-readiness

      - name: Verify readiness report
        run: pnpm run verify:readiness-report

      - name: Test
        run: pnpm run test:run

      - name: Build
        run: pnpm run build

      - name: Verify package exports
        run: pnpm run verify:exports

      - name: Verify npm package contents
        run: npm pack --dry-run --cache ./.npm-cache

  audit:
    name: Security audit (production deps only)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Disable minimumReleaseAge policy
        run: pnpm config set minimumReleaseAge 0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies (high gate)
        run: pnpm audit --audit-level high --prod

      - name: Audit production dependencies (moderate triage)
        continue-on-error: true
        run: pnpm audit --audit-level moderate --prod
