name: Desktop Wizard Release

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-2025
          - ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Disable minimumReleaseAge policy
        run: pnpm config set minimumReleaseAge 0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (typecheck + lint + architecture + modules + packages + plugin template + execution pipeline + skills + company readiness + readiness + test + build + exports + pack)
        run: pnpm run typecheck && pnpm run lint && pnpm run check:architecture && pnpm run verify:tool-modules && pnpm run verify:workspace-packages && pnpm run verify:tool-plugin-template && pnpm run verify:tool-execution-pipeline && pnpm run verify:skill-workflows && pnpm run verify:company-readiness && pnpm run verify:readiness-report && pnpm run test:run && pnpm run build && pnpm run verify:exports && npm pack --dry-run --cache ./.npm-cache

      - name: Audit production dependencies (high gate)
        if: matrix.os == 'ubuntu-24.04'
        run: pnpm audit --audit-level high --prod

      - name: Audit production dependencies (moderate triage)
        if: matrix.os == 'ubuntu-24.04'
        continue-on-error: true
        run: pnpm audit --audit-level moderate --prod

      - name: Report macOS signing mode
        if: matrix.os == 'macos-15' && github.ref_type == 'tag'
        env:
          CSC_LINK: ${{ secrets.MACOS_CSC_LINK || secrets.CSC_LINK }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "macOS release mode: Developer ID signed and notarized."
          else
            echo "::warning::macOS release mode: unsigned internal/public artifact."
          fi

      - name: Report Windows signing mode
        if: matrix.os == 'windows-2025' && github.ref_type == 'tag'
        shell: pwsh
        env:
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK || secrets.WIN_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if ($env:WINDOWS_CSC_LINK -and $env:WINDOWS_CSC_KEY_PASSWORD) {
            "Windows release mode: Authenticode signed installer."
          } else {
            "::warning::Windows release mode: unsigned installer."
          }

      - name: Select desktop signing credentials
        shell: bash
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK || secrets.CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD || secrets.CSC_KEY_PASSWORD }}
          WINDOWS_CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK || secrets.WIN_CSC_LINK }}
          WINDOWS_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD || secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            {
              echo "CSC_LINK=$MACOS_CSC_LINK"
              echo "CSC_KEY_PASSWORD=$MACOS_CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            {
              echo "CSC_LINK=$WINDOWS_CSC_LINK"
              echo "CSC_KEY_PASSWORD=$WINDOWS_CSC_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Build desktop artifacts
        run: pnpm run desktop:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify packaged desktop renderer
        run: pnpm run desktop:verify-artifact

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sap-mcp-wizard-${{ matrix.os }}
          path: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.exe
            release/desktop/*.tar.gz
            release/desktop/*.blockmap
            release/desktop/latest*.yml
          if-no-files-found: error

  publish:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download desktop artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sap-mcp-wizard-*
          path: release/desktop
          merge-multiple: true

      - name: Generate checksums
        run: node scripts/generate-desktop-checksums.mjs

      - name: Attach artifacts to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          make_latest: true
          tag_name: ${{ github.ref_name }}
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release/desktop/*.dmg
            release/desktop/*.zip
            release/desktop/*.exe
            release/desktop/*.tar.gz
            release/desktop/*.blockmap
            release/desktop/latest*.yml
            release/desktop/SHA256SUMS.txt
