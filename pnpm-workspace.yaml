packages:
  - .

overrides:
  '@hono/node-server': 2.0.10
  bigint-buffer: file:vendor/bigint-buffer
  body-parser: 1.20.6
  brace-expansion: 5.0.8
  esbuild: ^0.28.1
  fast-uri: 3.1.4
  hono: 4.12.27
  js-yaml@>=4.0.0 <4.3.0: 4.3.0
  langsmith: ^0.6.0
  uuid: ^11.1.1
  vite: 8.1.0
  ws: ^8.21.0
  postcss: ^8.5.18

onlyBuiltDependencies:
  - '@bentoguard/sdk'
  - bigint-buffer
  - bufferutil
  - esbuild
  - utf-8-validate

allowBuilds:
  '@bentoguard/sdk': true
  bigint-buffer: true
  bigint-buffer@file:vendor/bigint-buffer: true
  bufferutil: true
  electron: true
  electron-winstaller: true
  esbuild: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - '@oobe-protocol-labs/synapse-sap-sdk@1.0.2'
