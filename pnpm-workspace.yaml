packages:
  - .
  - packages/*
  - apps/*

overrides:
  '@hono/node-server': 2.0.10
  bigint-buffer: file:vendor/bigint-buffer
  body-parser: 1.20.6
  brace-expansion@<1.1.18: 1.1.18
  brace-expansion@>=2.0.0 <2.1.4: 2.1.4
  esbuild: ^0.28.1
  fast-uri: 3.1.5
  hono: 4.12.34
  js-yaml@>=4.0.0 <4.3.1: 4.3.1
  langsmith: ^0.6.0
  nanoid@<3.3.18: 3.3.18
  uuid: ^11.1.1
  vite: 8.1.0
  ws: ^8.21.0
  postcss: ^8.5.18

onlyBuiltDependencies:
  - '@bentoguard/sdk'
  - bigint-buffer
  - bufferutil
  - esbuild
  - protobufjs
  - utf-8-validate

allowBuilds:
  '@bentoguard/sdk': true
  better-sqlite3: true
  bigint-buffer: true
  bigint-buffer@file:vendor/bigint-buffer: true
  bufferutil: true
  electron: true
  electron-winstaller: true
  esbuild: true
  protobufjs: true
  utf-8-validate: true

minimumReleaseAgeExclude:
  - '@oobe-protocol-labs/synapse-sap-sdk@1.0.2'
